<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Geist:wght@400;500&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Thème aurora de Le Coup Parfait (apps/web/src/app/globals.css) */
      :root {
        --bg: #0e0f1f;
        --case-claire: #23253d;
        --case-foncee: #181a30;
        --surface-strong: #2c2f4a;
        --text: #f2f1f8;
        --text-muted: #b4b2c8;
        --text-faint: #8c8aa3;
        --accent: #7c5cff;
        --accent-2: #00e5a8;
        --case: 96px;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
        font-family: Geist, ui-sans-serif, system-ui, sans-serif;
      }
      #scene {
        position: absolute;
        inset: 0;
      }

      /* ── Acte 1 : le damier et le coup ── */
      #plateau-cadre {
        position: absolute;
        left: 576px;
        top: 156px;
        width: calc(var(--case) * 8);
        height: calc(var(--case) * 8);
      }
      #plateau {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(8, var(--case));
        grid-template-rows: repeat(8, var(--case));
        transform-origin: 528px 528px; /* centre de f3 */
      }
      .case {
        width: var(--case);
        height: var(--case);
      }
      .case.claire {
        background: var(--case-claire);
      }
      .case.foncee {
        background: var(--case-foncee);
      }
      #flash-f3 {
        position: absolute;
        left: 480px;
        top: 480px;
        width: var(--case);
        height: var(--case);
        background: var(--accent-2);
        opacity: 0;
      }
      .coord {
        position: absolute;
        font-size: 17px;
        font-weight: 500;
        color: var(--text-faint);
        letter-spacing: 0.04em;
      }
      #fleche {
        position: absolute;
        inset: 0;
        width: 768px;
        height: 768px;
        overflow: visible;
      }
      #petite-cavale {
        position: absolute;
        left: 576px;
        top: 624px; /* case g1 */
        width: var(--case);
        height: var(--case);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 6px;
      }
      #petite-cavale img {
        height: 80px;
        filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.45));
      }
      #badge {
        position: absolute;
        left: 548px;
        top: 452px;
        height: 46px;
        padding: 0 14px;
        border-radius: 23px;
        background: var(--accent-2);
        color: #06241b;
        font-family: 'Bricolage Grotesque', system-ui, sans-serif;
        font-weight: 800;
        font-size: 30px;
        line-height: 46px;
        letter-spacing: -0.02em;
      }

      /* ── Acte 2 : l'affiche ── */
      #affiche {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 120px 250px;
      }
      #texte {
        display: flex;
        flex-direction: column;
        gap: 34px;
      }
      #titre {
        font-family: 'Bricolage Grotesque', system-ui, sans-serif;
        font-weight: 750;
        font-variation-settings:
          'wdth' 92,
          'opsz' 96;
        font-size: 196px;
        line-height: 0.96;
        letter-spacing: -0.045em;
        color: var(--text);
      }
      .ligne {
        display: block;
        overflow: hidden;
        padding-bottom: 0.08em;
        margin-bottom: -0.08em;
      }
      .ligne > span {
        display: inline-block;
      }
      .exclam {
        color: var(--accent-2);
        margin-left: 0.04em;
      }
      #frise {
        display: flex;
        gap: 0;
      }
      #frise i {
        display: block;
        width: 34px;
        height: 34px;
      }
      #frise i:nth-child(odd) {
        background: var(--accent);
      }
      #frise i:nth-child(even) {
        background: var(--surface-strong);
      }
      #frise i:last-child {
        background: var(--accent-2);
      }
      #slogan {
        font-size: 46px;
        font-weight: 400;
        letter-spacing: -0.01em;
        color: var(--text-muted);
      }
      #cavale-col {
        position: relative;
        width: 560px;
        height: 840px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      #ombre {
        position: absolute;
        left: 90px;
        right: 90px;
        bottom: 4px;
        height: 46px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(0, 0, 0, 0.7), transparent);
      }
      #cavale {
        position: relative;
        width: 528px;
        height: 788px;
      }
      #cavale img,
      #reflet {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      /* Reflet sur la résine : un éclat lumineux découpé par la silhouette même de la Cavale */
      #reflet {
        background-image: linear-gradient(
          105deg,
          rgba(255, 255, 255, 0) 42%,
          rgba(255, 255, 255, 0.5) 50%,
          rgba(255, 255, 255, 0) 58%
        );
        background-size: 300% 100%;
        background-position: 100% 0;
        -webkit-mask-image: url('assets/cavale-aurora.webp');
        mask-image: url('assets/cavale-aurora.webp');
        -webkit-mask-size: 100% 100%;
        mask-size: 100% 100%;
        mix-blend-mode: screen;
      }
    </style>
  </head>
  <body>
    <div
      data-hf-id="hf-dpn5"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div
        data-hf-id="hf-pdot"
        id="scene"
        class="clip"
        data-start="0"
        data-duration="10"
        data-track-index="0"
      >
        <div data-hf-id="hf-oj31" id="plateau-cadre">
          <div data-hf-id="hf-x3z1" id="plateau">
            <!-- 64 cases générées plus bas, de a8 (haut gauche) à h1 -->
          </div>
        </div>

        <div data-hf-id="hf-8zw3" id="affiche">
          <div data-hf-id="hf-jypp" id="texte">
            <h1 data-hf-id="hf-cqvx" id="titre">
              <span data-hf-id="hf-mga9" class="ligne" data-layout-allow-overflow="true"
                ><span data-hf-id="hf-a95b" id="l1">Le Coup</span></span
              >
              <span data-hf-id="hf-r2ed" class="ligne" data-layout-allow-overflow="true"
                ><span data-hf-id="hf-ge7r" id="l2"
                  >Parfait<span data-hf-id="hf-taej" class="exclam">!!</span></span
                ></span
              >
            </h1>
            <div data-hf-id="hf-spmq" id="frise">
              <i data-hf-id="hf-wt6k"></i><i data-hf-id="hf-zeb8"></i><i data-hf-id="hf-y7e5"></i
              ><i data-hf-id="hf-ylp6"></i><i data-hf-id="hf-0l8b"></i><i data-hf-id="hf-0zjc"></i
              ><i data-hf-id="hf-zsm9"></i><i data-hf-id="hf-06xa"></i>
            </div>
            <p data-hf-id="hf-w45z" id="slogan">Les échecs, enfin expliqués.</p>
          </div>
          <div data-hf-id="hf-ljbe" id="cavale-col">
            <div data-hf-id="hf-3ycy" id="ombre"></div>
            <div data-hf-id="hf-9vsr" id="cavale">
              <img data-hf-id="hf-a9nd" src="assets/cavale-aurora.webp" alt="" />
              <div data-hf-id="hf-mofb" id="reflet"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Les bruitages de l'appli (apps/web/public/sounds, voir ATTRIBUTION.md),
           avec les gains de lib/sound.ts : le « clac » quand la Cavale se pose
           en g1, l'échec quand elle saute en f3, la victoire du mat sur « !! ». -->
      <audio
        id="son-pose"
        src="assets/sons/move.mp3"
        data-start="1.52"
        data-duration="0.2"
        data-track-index="2"
        data-volume="0.85"
      ></audio>
      <audio
        id="son-echec"
        src="assets/sons/check.mp3"
        data-start="3.08"
        data-duration="0.5"
        data-track-index="3"
        data-volume="1"
      ></audio>
      <audio
        id="son-mat"
        src="assets/sons/victory.mp3"
        data-start="3.4"
        data-duration="0.63"
        data-track-index="4"
        data-volume="0.8"
      ></audio>
    </div>

    <script>
      // ── Construction du damier (synchrone, déterministe) ──
      const plateau = document.getElementById('plateau')
      const cases = []
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const el = document.createElement('div')
          // a1 (c=0, r=7) est une case foncée
          el.className = 'case ' + ((r + c) % 2 === 0 ? 'claire' : 'foncee')
          el.dataset.diag = String(c + (7 - r)) // 0 en a1 → 14 en h8
          plateau.appendChild(el)
          cases.push(el)
        }
      }
      const flash = document.createElement('div')
      flash.id = 'flash-f3'
      plateau.appendChild(flash)

      const coords = []
      'abcdefgh'.split('').forEach((l, i) => {
        const el = document.createElement('span')
        el.className = 'coord'
        el.textContent = l
        el.style.left = i * 96 + 42 + 'px'
        el.style.top = '780px'
        plateau.appendChild(el)
        coords.push(el)
      })
      for (let i = 0; i < 8; i++) {
        const el = document.createElement('span')
        el.className = 'coord'
        el.textContent = String(8 - i)
        el.style.left = '-30px'
        el.style.top = i * 96 + 36 + 'px'
        plateau.appendChild(el)
        coords.push(el)
      }

      // Flèche du coup g1 → f3 (centres : g1 624,720 · g3 624,528 · f3 528,528)
      plateau.insertAdjacentHTML(
        'beforeend',
        `<svg id="fleche" viewBox="0 0 768 768">
          <path id="trait" d="M624 700 L624 528 L556 528" fill="none" stroke="#00e5a8"
            stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
          <polygon id="pointe" points="530,528 562,506 562,550" fill="#00e5a8" />
        </svg>`,
      )
      plateau.insertAdjacentHTML(
        'beforeend',
        `<div id="petite-cavale"><img src="assets/cavale-aurora.webp" alt="" /></div>
         <div id="badge">!!</div>`,
      )

      const trait = document.getElementById('trait')
      const longueur = trait.getTotalLength()
      trait.style.strokeDasharray = longueur

      // ── Timeline ──
      const tl = gsap.timeline({ paused: true })

      // Acte 1 — le damier se pose en vague diagonale depuis a1
      cases.forEach((el) => {
        const d = Number(el.dataset.diag)
        tl.fromTo(
          el,
          { scale: 0.2, autoAlpha: 0 },
          { scale: 1, autoAlpha: 1, duration: 0.42, ease: 'power3.out' },
          0.15 + d * 0.06,
        )
      })
      tl.fromTo(coords, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, stagger: 0.02 }, 1.0)

      // La petite Cavale se pose en g1
      tl.fromTo(
        '#petite-cavale',
        { autoAlpha: 0, y: -40 },
        { autoAlpha: 1, y: 0, duration: 0.45, ease: 'power3.out' },
        1.3,
      )

      // La flèche menthe trace le L du cavalier
      tl.fromTo(
        trait,
        { strokeDashoffset: longueur, autoAlpha: 0.9 },
        { strokeDashoffset: 0, duration: 0.6, ease: 'power2.inOut' },
        1.8,
      )
      tl.fromTo(
        '#pointe',
        { autoAlpha: 0, scale: 0.4, transformOrigin: '530px 528px' },
        { autoAlpha: 1, scale: 1, duration: 0.2, ease: 'back.out(2)' },
        2.32,
      )

      // Le saut : deux cases en avant, une sur le côté
      tl.to('#petite-cavale', { y: -192, duration: 0.32, ease: 'power2.inOut' }, 2.6)
      tl.to('#petite-cavale', { x: -96, duration: 0.22, ease: 'power2.out' }, 2.92)
      tl.to(['#trait', '#pointe'], { autoAlpha: 0, duration: 0.3 }, 2.75)

      // Atterrissage en f3 : éclat de la case et « !! »
      tl.fromTo(
        '#flash-f3',
        { autoAlpha: 0.85 },
        { autoAlpha: 0, duration: 0.6, ease: 'power2.out', immediateRender: false },
        3.12,
      )
      tl.fromTo(
        '#badge',
        { autoAlpha: 0, scale: 0.4, transformOrigin: '50% 50%' },
        { autoAlpha: 1, scale: 1, duration: 0.35, ease: 'back.out(2.6)' },
        3.15,
      )

      // Acte 2 — plongée dans la case f3
      tl.to(['#petite-cavale', '#badge'], { autoAlpha: 0, duration: 0.25, ease: 'power1.in' }, 3.75)
      tl.to(coords, { autoAlpha: 0, duration: 0.25 }, 3.75)
      tl.to('#plateau', { scale: 26, x: -144, y: -144, duration: 1.0, ease: 'power3.in' }, 3.8)
      tl.to('#plateau-cadre', { autoAlpha: 0, duration: 0.55, ease: 'power1.inOut' }, 4.55)

      // La grande Cavale surgit au centre…
      tl.fromTo(
        '#cavale-col',
        { autoAlpha: 0, x: -430, y: 70, scale: 0.9, filter: 'blur(16px)' },
        { autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)', duration: 1.1, ease: 'power3.out' },
        4.5,
      )
      // …la lumière glisse sur la résine…
      tl.fromTo(
        '#reflet',
        { backgroundPosition: '100% 0' },
        { backgroundPosition: '0% 0', duration: 1.2, ease: 'power2.inOut' },
        5.0,
      )
      // …puis elle prend sa place à droite
      tl.to('#cavale-col', { x: 0, duration: 0.9, ease: 'power3.inOut' }, 5.7)

      // Le titre monte ligne par ligne
      tl.fromTo('#l1', { yPercent: 110 }, { yPercent: 0, duration: 0.75, ease: 'power4.out' }, 6.05)
      tl.fromTo('#l2', { yPercent: 110 }, { yPercent: 0, duration: 0.75, ease: 'power4.out' }, 6.2)

      // Frise de damier, la dernière case en menthe
      tl.fromTo(
        '#frise i',
        { scaleY: 0, transformOrigin: '50% 100%' },
        { scaleY: 1, duration: 0.3, ease: 'power3.out', stagger: 0.05 },
        6.8,
      )

      tl.fromTo(
        '#slogan',
        { autoAlpha: 0, y: 24 },
        { autoAlpha: 1, y: 0, duration: 0.6, ease: 'power3.out' },
        7.3,
      )

      // Tenue : la Cavale respire à peine
      tl.to(
        '#cavale',
        { scale: 1.015, transformOrigin: '50% 100%', duration: 1.9, ease: 'sine.inOut' },
        7.5,
      )

      // Sortie : fondu au fond
      tl.to('#affiche', { autoAlpha: 0, duration: 0.5, ease: 'power2.in' }, 9.45)

      window.__timelines = window.__timelines || {}
      window.__timelines['main'] = tl
      tl.seek(0)
    </script>
  </body>
</html>
