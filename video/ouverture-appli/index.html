<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /*
       * Ouverture animée de l'appli Android. Canevas de 360 × 640 dp rendu à 3×
       * (xxhdpi), sur le fond de l'appli (@color/fond) : l'appli le pose sur
       * un voile de la même couleur.
       *
       * La première image doit être identique à l'écran de démarrage natif :
       * la Cavale haute de 168 dp (504 px), centrée. Android ne la laisse pas
       * plus grande (elle doit tenir dans un cercle de 192 dp) : c'est donc
       * l'animation qui la fait grandir, jusqu'à 280 dp (840 px). L'image est
       * tirée à sa taille finale et part à l'échelle 0,6.
       */
      :root {
        --fond: #0b0b14;
        --text: #f2f1f8;
        --surface-strong: #2c2f4a;
        --accent: #7c5cff;
        --accent-2: #00e5a8;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--fond);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--fond);
      }
      #scene {
        position: absolute;
        inset: 0;
      }
      /* Calque plein cadre qui centre la Cavale exactement comme Android */
      #centre {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #cavale {
        position: relative;
        width: 551px;
        height: 840px;
      }
      #cavale img,
      #reflet {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      /* L'éclat lumineux, découpé par la silhouette de la Cavale */
      #reflet {
        background-image: linear-gradient(
          105deg,
          rgba(255, 255, 255, 0) 40%,
          rgba(255, 255, 255, 0.55) 50%,
          rgba(255, 255, 255, 0) 60%
        );
        background-size: 300% 100%;
        background-position: 100% 0;
        -webkit-mask-image: url('assets/cavale.png');
        mask-image: url('assets/cavale.png');
        -webkit-mask-size: 100% 100%;
        mask-size: 100% 100%;
      }
      #badge {
        position: absolute;
        left: 436px;
        top: 10px;
        height: 130px;
        padding: 0 36px;
        border-radius: 65px;
        background: var(--accent-2);
        color: #06241b;
        font-family: 'Bricolage Grotesque', system-ui, sans-serif;
        font-weight: 800;
        font-size: 86px;
        line-height: 130px;
        letter-spacing: -0.02em;
      }
      #marque {
        position: absolute;
        left: 0;
        right: 0;
        top: 1250px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 48px;
      }
      #nom {
        font-family: 'Bricolage Grotesque', system-ui, sans-serif;
        font-weight: 750;
        font-variation-settings: 'wdth' 92, 'opsz' 96;
        font-size: 150px;
        line-height: 1;
        letter-spacing: -0.045em;
        color: var(--text);
        white-space: nowrap;
      }
      #frise {
        display: flex;
      }
      #frise i {
        display: block;
        width: 56px;
        height: 56px;
      }
      #frise i:nth-child(odd) {
        background: var(--accent);
      }
      #frise i:nth-child(even) {
        background: var(--surface-strong);
      }
      #frise i:last-child {
        background: var(--accent-2);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="1.9"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <div id="scene" class="clip" data-start="0" data-duration="1.9" data-track-index="0">
        <div id="centre">
          <div id="cavale">
            <img src="assets/cavale.png" alt="" />
            <div id="reflet"></div>
            <div id="badge">!!</div>
          </div>
        </div>
        <div id="marque">
          <div id="nom">Le Coup Parfait</div>
          <div id="frise"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 1,9 s : l'animation s'arrête à la fin du dernier mouvement. La tenue
      // sur l'image finale est jouée par l'appli (Ouverture.java, TENUE_MS) :
      // une dernière image longue dans le WebP n'est pas attendue par Android,
      // qui déclare l'animation finie dès qu'il l'affiche. Les sons suivent ces
      // instants : la Cavale se pose à 0,85 s (le « clac »), « !! » claque à
      // 1,55 s (la victoire) et s'immobilise à 1,85 s.

      // La Cavale grandit de 168 à 280 dp en montant un peu trop haut…
      // Elle part exactement de l'image de l'écran natif : échelle 0,6, centrée.
      tl.fromTo(
        '#cavale',
        { scale: 0.6, y: 0 },
        { scale: 1.02, y: -240, duration: 0.55, ease: 'power2.out' },
        0.15,
      );
      // …puis se pose d'un coup sec, comme une pièce sur l'échiquier : le
      // « clac » tombe sur ce contact, à 0,85 s.
      tl.to('#cavale', { scale: 1, y: -180, duration: 0.15, ease: 'power3.in' }, 0.7);

      // La lumière glisse sur la résine, une fois la pièce posée
      tl.fromTo(
        '#reflet',
        { backgroundPosition: '100% 0' },
        { backgroundPosition: '0% 0', duration: 0.7, ease: 'power2.inOut' },
        0.95,
      );

      tl.fromTo(
        '#nom',
        { autoAlpha: 0, y: 50 },
        { autoAlpha: 1, y: 0, duration: 0.45, ease: 'power3.out' },
        0.85,
      );

      // Frise de damier, la dernière case en menthe
      tl.fromTo(
        '#frise i',
        { scaleY: 0, transformOrigin: '50% 100%' },
        { scaleY: 1, duration: 0.25, ease: 'power3.out', stagger: 0.04 },
        1.15,
      );

      // Le coup brillant
      tl.fromTo(
        '#badge',
        { autoAlpha: 0, scale: 0.4, transformOrigin: '20% 80%' },
        { autoAlpha: 1, scale: 1, duration: 0.3, ease: 'back.out(2.6)' },
        1.55,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
