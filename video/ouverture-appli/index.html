<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1440" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /*
       * Ouverture animée de l'appli Android. Canevas de 360 × 480 dp rendu à 3×
       * (xxhdpi), sur le fond de l'appli (@color/fond) : l'appli le pose sur
       * un voile de la même couleur. La première image doit être identique à
       * l'écran de démarrage natif : la Cavale haute de 168 dp (504 px), centrée.
       */
      :root {
        --fond: #0b0b14;
        --text: #f2f1f8;
        --surface-strong: #2c2f4a;
        --accent: #7c5cff;
        --accent-2: #00e5a8;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1440px;
        overflow: hidden;
        background: var(--fond);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1440px;
        overflow: hidden;
        background: var(--fond);
      }
      #scene {
        position: absolute;
        inset: 0;
      }
      /* Calque plein cadre qui centre la Cavale exactement comme Android */
      #centre {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #cavale {
        position: relative;
        width: 331px;
        height: 504px;
      }
      #cavale img,
      #reflet {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      /* L'éclat lumineux, découpé par la silhouette de la Cavale */
      #reflet {
        background-image: linear-gradient(
          105deg,
          rgba(255, 255, 255, 0) 40%,
          rgba(255, 255, 255, 0.55) 50%,
          rgba(255, 255, 255, 0) 60%
        );
        background-size: 300% 100%;
        background-position: 100% 0;
        -webkit-mask-image: url('assets/cavale.png');
        mask-image: url('assets/cavale.png');
        -webkit-mask-size: 100% 100%;
        mask-size: 100% 100%;
      }
      #badge {
        position: absolute;
        left: 262px;
        top: 6px;
        height: 84px;
        padding: 0 24px;
        border-radius: 42px;
        background: var(--accent-2);
        color: #06241b;
        font-family: 'Bricolage Grotesque', system-ui, sans-serif;
        font-weight: 800;
        font-size: 56px;
        line-height: 84px;
        letter-spacing: -0.02em;
      }
      #marque {
        position: absolute;
        left: 0;
        right: 0;
        top: 870px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 34px;
      }
      #nom {
        font-family: 'Bricolage Grotesque', system-ui, sans-serif;
        font-weight: 750;
        font-variation-settings:
          'wdth' 92,
          'opsz' 96;
        font-size: 104px;
        line-height: 1;
        letter-spacing: -0.045em;
        color: var(--text);
        white-space: nowrap;
      }
      #frise {
        display: flex;
      }
      #frise i {
        display: block;
        width: 42px;
        height: 42px;
      }
      #frise i:nth-child(odd) {
        background: var(--accent);
      }
      #frise i:nth-child(even) {
        background: var(--surface-strong);
      }
      #frise i:last-child {
        background: var(--accent-2);
      }
    </style>
  </head>
  <body>
    <div
      data-hf-id="hf-2mou"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="1"
      data-fps="30"
      data-width="1080"
      data-height="1440"
    >
      <div
        data-hf-id="hf-h9sx"
        id="scene"
        class="clip"
        data-start="0"
        data-duration="1"
        data-track-index="0"
      >
        <div data-hf-id="hf-oqz8" id="centre">
          <div data-hf-id="hf-9vsr" id="cavale">
            <img data-hf-id="hf-ibtd" src="assets/cavale.png" alt="" />
            <div data-hf-id="hf-mofb" id="reflet"></div>
            <div data-hf-id="hf-au4w" id="badge">!!</div>
          </div>
        </div>
        <div data-hf-id="hf-7u3i" id="marque">
          <div data-hf-id="hf-y71i" id="nom">Le Coup Parfait</div>
          <div data-hf-id="hf-spmq" id="frise">
            <i data-hf-id="hf-wt6k"></i><i data-hf-id="hf-zeb8"></i><i data-hf-id="hf-y7e5"></i
            ><i data-hf-id="hf-ylp6"></i><i data-hf-id="hf-0l8b"></i><i data-hf-id="hf-0zjc"></i
            ><i data-hf-id="hf-zsm9"></i><i data-hf-id="hf-06xa"></i>
          </div>
        </div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true })

      // Une seconde en tout : l'ouverture ne doit pas faire attendre.
      // Les instants des sons (Ouverture.java) suivent ceux-ci : la Cavale
      // finit de s'élever à 0,47 s, « !! » claque à 0,7 s.

      // La lumière glisse sur la résine pendant que l'écran natif s'efface
      tl.fromTo(
        '#reflet',
        { backgroundPosition: '100% 0' },
        { backgroundPosition: '0% 0', duration: 0.4, ease: 'power2.inOut' },
        0.05,
      )

      // La Cavale s'élève de 44 dp pour faire place au nom
      tl.fromTo('#cavale', { y: 0 }, { y: -132, duration: 0.35, ease: 'power3.inOut' }, 0.12)

      tl.fromTo(
        '#nom',
        { autoAlpha: 0, y: 36 },
        { autoAlpha: 1, y: 0, duration: 0.3, ease: 'power3.out' },
        0.3,
      )

      // Frise de damier, la dernière case en menthe
      tl.fromTo(
        '#frise i',
        { scaleY: 0, transformOrigin: '50% 100%' },
        { scaleY: 1, duration: 0.18, ease: 'power3.out', stagger: 0.025 },
        0.45,
      )

      // Le coup brillant
      tl.fromTo(
        '#badge',
        { autoAlpha: 0, scale: 0.4, transformOrigin: '20% 80%' },
        { autoAlpha: 1, scale: 1, duration: 0.22, ease: 'back.out(2.6)' },
        0.7,
      )

      window.__timelines = window.__timelines || {}
      window.__timelines['main'] = tl
      tl.seek(0)
    </script>
  </body>
</html>
