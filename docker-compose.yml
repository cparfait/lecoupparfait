# ─────────────────────────────────────────────────────────────────────────────
#  Le Coup Parfait — déploiement auto-hébergé
#
#  Quatre services :
#    db      PostgreSQL 17, seul service à conserver un volume de données
#    backup  un dump par jour, quinze jours de conservation
#    server  Stockfish natif + temps réel  (3001)
#    web     interface Next.js             (3000)
#
#  ── Cloisonnement ───────────────────────────────────────────────────────────
#
#  Cette pile ne partage AUCUN réseau avec les autres applications du serveur.
#  Elle a sa propre façade, `web-coupparfait`, sur laquelle seul Nginx Proxy
#  Manager se branche.
#
#  Le montage habituel — un réseau `proxy` commun où l'on branche tout — a un
#  défaut qui n'est pas théorique : sur un réseau Docker, tout le monde se
#  joint. N'importe quel conteneur d'une autre application pourrait ouvrir une
#  connexion vers `coupparfait-web:3000`, sans TLS, sans journal du proxy, sans
#  aucune des règles configurées dans NPM. Une image compromise ailleurs sur le
#  serveur devient un point de départ.
#
#  Même doctrine que les piles `laeti` et `monplandeclasse` déjà en place —
#  voir `Laeti/infra/RESEAU.md`. Créer la façade une fois :
#
#      docker network create web-coupparfait
#
#  ── Mise en service ─────────────────────────────────────────────────────────
#
#      cp .env.example .env      puis renseigner les secrets
#      docker compose up -d --build
#      docker compose exec web node scripts/migrate.mjs     # crée le schéma
#      docker compose exec web node scripts/import-openings.mjs
#      docker compose exec web node scripts/import-puzzles.mjs
#
#  Puis, dans Nginx Proxy Manager, deux hôtes mandataires :
#
#    | Domaine                        | Forward Hostname  | Port | WebSocket |
#    |--------------------------------|-------------------|------|-----------|
#    | coupparfait.mondomaine.fr      | coupparfait-web   | 3000 | oui       |
#    | coupparfait-api.mondomaine.fr  | coupparfait-api   | 3001 | requis    |
#
#  Le second n'est pas facultatif : le temps réel passe par lui, et sans
#  WebSocket les parties entre amis ne démarrent pas.
# ─────────────────────────────────────────────────────────────────────────────

# Docker préfixe conteneurs et volumes avec ce nom — « coupparfait-web-1 »,
# « coupparfait_db-data ». Sans cette ligne il prendrait celui du dossier, qui
# ne dit rien sur un serveur qui héberge plusieurs projets.
name: coupparfait

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coupparfait}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?le mot de passe PostgreSQL est obligatoire}
      POSTGRES_DB: ${POSTGRES_DB:-coupparfait}
      # Le tri « C » est nettement plus rapide et suffit : aucun classement
      # alphabétique n'est présenté à l'utilisateur depuis la base.
      # `scram-sha-256` impose le mot de passe chiffré, y compris sur le réseau
      # interne — un réseau privé n'est pas un réseau de confiance.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C --auth-host=scram-sha-256'
    volumes:
      - db-data:/var/lib/postgresql/data
    # Aucun port publié. La base était exposée sur `127.0.0.1:5432` : commode
    # pour brancher un client, et c'est un accès sans TLS ni journal offert à
    # quiconque obtient un shell sur la machine. Pour une inspection ponctuelle,
    # `docker compose exec db psql` passe par le conteneur et ne laisse rien
    # d'ouvert derrière lui.
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-coupparfait} -d ${POSTGRES_DB:-coupparfait}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

  # ── Sauvegarde ──────────────────────────────────────────────────────────────
  #
  # Un dump par jour, quinze jours de conservation. Même montage que les deux
  # autres piles du serveur, et le même avertissement, qui vaut d'être répété :
  # **ces fichiers vivent sur la machine qu'ils sauvegardent**. Tant qu'ils
  # n'ont pas été recopiés ailleurs, ils protègent d'une fausse manœuvre, pas
  # d'une perte du serveur.
  #
  # Ce qu'il y a dedans : des comptes, des parties, des analyses. Rien de
  # sensible au sens de données d'élèves — mais des mots de passe hachés et des
  # adresses e-mail, qui suffisent à justifier qu'on ne laisse pas traîner le
  # dossier.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c "while true; do
        pg_dump -h db -U ${POSTGRES_USER:-coupparfait} -d ${POSTGRES_DB:-coupparfait} -Fc
          -f /backups/coupparfait-$$(date +%Y%m%d-%H%M%S).dump &&
        find /backups -name 'coupparfait-*.dump' -mtime +14 -delete;
        sleep 86400;
      done"
    networks:
      - internal

  # ── Messagerie sortante ─────────────────────────────────────────────────────
  #
  # Un MTA à nous, et rien d'autre : il n'envoie que ce que `web` lui remet —
  # confirmation d'adresse et réinitialisation de mot de passe. Il ne reçoit
  # rien, n'expose aucun port, et n'est joignable que depuis le réseau interne.
  #
  # **Pourquoi un serveur plutôt qu'un fournisseur.** C'est le choix assumé du
  # projet : pas de compte tiers, pas de quota, pas de traqueur d'ouverture
  # glissé dans les messages. Le prix se paie en configuration DNS — voir
  # `docs/courriel.md`, qui donne les quatre enregistrements à poser.
  #
  # **Ce qu'il ne résout pas.** La délivrabilité se joue d'abord sur la
  # réputation de l'IP sortante, pas sur le conteneur. Deux applications
  # hébergées sur la même machine partagent cette IP : un MTA distinct leur
  # donne des identités DKIM séparées, jamais des réputations séparées. Si cette
  # séparation compte, il faut une seconde IP et lier le service dessus.
  #
  # Facultatif : sans le profil, la pile démarre sans lui et l'application
  # masque d'elle-même la récupération de mot de passe.
  #     docker compose --profile courriel up -d
  mail:
    image: boky/postfix:v4.4.0
    restart: unless-stopped
    profiles: [courriel]
    environment:
      # Le domaine qui signe. Il doit correspondre à celui de MAIL_FROM, sans
      # quoi la signature DKIM ne couvre pas l'expéditeur et le message est
      # rejeté — c'est le premier motif de refus, très loin devant les autres.
      #
      # Sans « :? », bien qu'il soit obligatoire : Compose interpole **avant**
      # de filtrer par profil, donc un « docker compose up -d » ordinaire
      # échouerait sur une variable qui ne concerne qu'un service qu'il ne
      # démarre même pas. Vide, le conteneur refuse de démarrer et le dit —
      # au bon endroit, c'est-à-dire seulement quand on l'a demandé.
      ALLOWED_SENDER_DOMAINS: ${MAIL_DOMAIN:-}
      HOSTNAME: ${MAIL_HOSTNAME:-mail.${MAIL_DOMAIN}}
      # La génération de la paire DKIM n'est **pas** automatique : sans ce
      # drapeau, l'image démarre sans clé, ne signe rien, et ne le dit que dans
      # ses journaux. Les messages partent alors non signés, ce qui est le cas
      # le plus difficile à diagnostiquer — tout a l'air de fonctionner, et
      # Gmail les jette en silence.
      DKIM_AUTOGENERATE: '1'
      # Le sélecteur entre dans le nom de l'enregistrement DNS : `mail` donne
      # `mail._domainkey.<domaine>`. La clé est conservée dans le volume `dkim`.
      DKIM_SELECTOR: ${MAIL_DKIM_SELECTOR:-mail}
      # Personne ne s'authentifie : le seul client est `web`, sur un réseau
      # privé sans accès à Internet entrant.
      RELAYHOST: ''
    volumes:
      - dkim:/etc/opendkim/keys
    # Les deux réseaux, et il les faut tous les deux. `internal` est le seul par
    # lequel `web` le joint ; mais il est déclaré `internal: true`, donc sans
    # route vers Internet — un MTA branché là seul accepterait les messages et
    # ne pourrait jamais les livrer. La façade lui donne la sortie.
    #
    # Aucun alias sur la façade, à la différence de `web` et `server` : Nginx
    # Proxy Manager n'a rien à adresser ici. Et aucun port publié, surtout pas
    # le 25 — ce service ne reçoit pas de courrier, il ne fait qu'émettre.
    networks:
      - internal
      - web-coupparfait
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 587 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        # Renseigné par `scripts/deployer.sh`, qui y met `git rev-parse HEAD`.
        # Une construction lancée à la main sans cette variable produit une
        # image étiquetée « inconnue » — ce qui est la vérité, et ce que le
        # script refuse ensuite de reconnaître comme un déploiement.
        GIT_REVISION: ${GIT_REVISION:-inconnue}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-coupparfait}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-coupparfait}
      SERVER_PORT: 3001
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      STOCKFISH_PATH: /usr/local/bin/stockfish
      ENGINE_POOL_SIZE: ${ENGINE_POOL_SIZE:-2}
      ENGINE_THREADS: ${ENGINE_THREADS:-2}
      ENGINE_HASH_MB: ${ENGINE_HASH_MB:-256}
      ENGINE_DEFAULT_DEPTH: ${ENGINE_DEFAULT_DEPTH:-24}
      ENGINE_MAX_DEPTH: ${ENGINE_MAX_DEPTH:-34}
      ENGINE_MAX_QUEUE: ${ENGINE_MAX_QUEUE:-16}
      # Le serveur compte ses requêtes par adresse, et il n'en voit jamais une
      # vraie : il y a toujours quelque chose devant lui — la passerelle
      # `/api/analyse` du conteneur web, et le relais d'entrée. Sans ce
      # drapeau, il ne croit que `socket.remoteAddress`, c'est-à-dire l'adresse
      # du conteneur voisin, et le quota d'une route se partagerait entre tous
      # les joueurs. Ici la chaîne est interne et connue : on la croit.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      LICHESS_TABLEBASE_URL: ${LICHESS_TABLEBASE_URL:-https://tablebase.lichess.ovh}
      # Voix neuronale du coach. Ces chemins existent dans l'image ; si Piper
      # n'a pas été inclus à la construction, l'application bascule d'elle-même
      # sur la synthèse du navigateur.
      PIPER_BIN: ${PIPER_BIN:-/opt/piper/piper}
      PIPER_VOICES_DIR: ${PIPER_VOICES_DIR:-/app/voices}
      # Notifications poussées. C'est ce conteneur, et lui seul, qui envoie le
      # rappel du défi du jour : il est le seul à tourner en permanence. Sans
      # clés — `npm run vapid` —, la boucle ne démarre pas. Voir `.env.example`.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      DEFI_RAPPEL_HEURE: ${DEFI_RAPPEL_HEURE:-18}
    # Aucun port publié : NPM joint le conteneur par `web-coupparfait`. Publier
    # « 3001:3001 » l'ouvrait sur toutes les interfaces de la machine, donc
    # depuis Internet, en clair et hors du proxy.
    # À décommenter seulement si NPM tourne sur une AUTRE machine :
    # ports:
    #   - '127.0.0.1:3001:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      # Dix secondes et non trente : `scripts/deployer.sh` attend la sonde pour
      # déclarer la bascule terminée (`up -d --wait`), et l'attente ne peut pas
      # être plus courte que l'intervalle. Une sonde qui coûte un `fetch` local
      # peut se permettre d'être fréquente.
      #
      # `start_period` reste à 40s : le vivier Stockfish met un moment à
      # s'ouvrir. Ce délai ne retarde rien — pendant cette fenêtre les échecs
      # sont ignorés, mais un succès prend effet immédiatement.
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          # Stockfish consomme autant de mémoire qu'on lui en donne (table de
          # hachage). Cette borne évite qu'il n'étouffe l'hôte — et ses
          # voisins, puisque le serveur en héberge d'autres.
          memory: ${SERVER_MEMORY_LIMIT:-2g}
    networks:
      internal:
      web-coupparfait:
        # Le nom que Nginx Proxy Manager renseigne en « Forward Hostname ».
        # « api » et non « server » : NPM voit passer toutes les applications du
        # serveur, et « server » n'y désignerait rien.
        aliases: [coupparfait-api]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Voir la remarque du service `server`.
        GIT_REVISION: ${GIT_REVISION:-inconnue}
        # L'adresse du temps réel est lue par le navigateur : Next la grave
        # dans le lot JavaScript pendant `next build`, et la variable
        # d'exécution déclarée plus bas ne l'atteint jamais. Elle doit donc
        # traverser la construction — voir `apps/web/Dockerfile`, qui refuse
        # de construire sans elle.
        #
        # Sans « :? », bien qu'elle soit obligatoire : Compose interpole ce
        # fichier pour *toutes* les commandes, y compris `ps` et `logs`. Un
        # garde-fou ici rendrait la pile inspectable seulement quand elle est
        # bien configurée, ce qui est exactement l'inverse du besoin. Le refus
        # a sa place à la construction, et il y est.
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-coupparfait}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-coupparfait}
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-30}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # Ici, elle ne sert plus qu'au rendu serveur : dernier recours des routes
      # `/api/*` quand `INTERNAL_SERVER_URL` manque. Ce que voit le navigateur
      # a été fixé à la construction, plus haut.
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3001}
      # Le chemin interne vers le serveur d'analyse, par le réseau de données :
      # les requêtes serveur-à-serveur n'ont aucune raison de ressortir sur
      # Internet pour revenir par le proxy.
      INTERNAL_SERVER_URL: http://server:3001
      # Qui ouvre /admin. Vide, l'administration reste fermée et la page se
      # comporte comme une adresse inexistante. Voir `.env.example`.
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
      # Messagerie sortante. Vide tant que le profil `courriel` n'est pas
      # démarré : l'application le détecte et masque d'elle-même la
      # récupération de mot de passe, plutôt que de promettre un message qui ne
      # partira pas. Voir `docs/courriel.md`.
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Notifications poussées : ici pour l'abonnement et pour prévenir d'une
      # invitation. Vides, le réglage disparaît de la page des préférences.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    # Aucun port publié : voir la remarque du service `server`.
    # ports:
    #   - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      # Même raison que pour `server` : c'est cette sonde qui dit à
      # `scripts/deployer.sh` que la nouvelle version sert vraiment.
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      internal:
      web-coupparfait:
        # Le nom que Nginx Proxy Manager renseigne en « Forward Hostname ».
        aliases: [coupparfait-web]

volumes:
  db-data:
    driver: local

  # La paire DKIM, fabriquée au premier démarrage du MTA. À conserver : la
  # regénérer invalide l'enregistrement DNS publié, et tous les messages
  # signés avec la nouvelle clé seront refusés tant que la zone n'a pas suivi.
  dkim:
    driver: local

networks:
  # La base, sa sauvegarde, et le chemin entre les deux applications.
  # `internal: true` retire l'accès à Internet : ni la base ni le service de
  # sauvegarde n'ont de raison de sortir, et une base qui ne peut pas sortir ne
  # peut rien exfiltrer.
  #
  # Cela ne gêne ni `web` ni `server` : Docker leur donne leur sortie par le
  # réseau de façade, sur lequel ils sont également branchés. Ils gardent donc
  # leur accès aux tables de finales de Lichess, à l'import chess.com et
  # Lichess, et à l'assistant s'il est configuré.
  internal:
    driver: bridge
    internal: true

  # Façade de cette application, partagée avec Nginx Proxy Manager seulement.
  # Le créer une fois :  docker network create web-coupparfait
  web-coupparfait:
    external: true
