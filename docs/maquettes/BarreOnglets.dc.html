<script type="text/x-dc" data-dc-script data-props='{"actif":{"editor":"enum","options":["accueil","jouer","progresser","analyser","plus"],"default":"accueil"},"theme":{"editor":"enum","options":["sombre","clair"],"default":"sombre"},"$preview":{"width":390,"height":84}}'>
class Component extends DCLogic {
  renderVals() {
    const actif = this.props.actif ?? 'accueil';
    const clair = (this.props.theme ?? 'sombre') === 'clair';
    const p = clair
      ? { barre: 'rgba(255,255,255,0.94)', bord: '#e4e2ee', repos: '#4f4e63', actif: '#5b3ce0', fondActif: '#ece8fd' }
      : { barre: 'rgba(20,21,40,0.94)', bord: '#2a2d48', repos: '#a9a8c2', actif: '#c4b6ff', fondActif: '#2d2658' };
    const onglet = (id) => {
      const on = id === actif;
      return { couleur: on ? p.actif : p.repos, fond: on ? p.fondActif : 'transparent', graisse: on ? 600 : 500, courant: on ? 'page' : 'false' };
    };
    return {
      p,
      a0: onglet('accueil'), a1: onglet('jouer'), a2: onglet('progresser'), a3: onglet('analyser'), a4: onglet('plus'),
    };
  }
}
</script>
