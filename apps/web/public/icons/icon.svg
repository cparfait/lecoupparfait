<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Gambit">
  <!--
    Icône de Gambit : un cavalier stylisé sur un damier en dégradé.
    Le cavalier plutôt que le roi, parce que c'est la pièce qui saute par-dessus
    les autres — l'idée d'un chemin qu'on ne voyait pas.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="55%" stop-color="#5B3CE0"/>
      <stop offset="100%" stop-color="#00E5A8"/>
    </linearGradient>
    <linearGradient id="piece" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DDD8F5"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Damier discret en filigrane -->
  <g opacity="0.11" fill="#000">
    <rect x="0" y="0" width="64" height="64"/><rect x="128" y="0" width="64" height="64"/>
    <rect x="256" y="0" width="64" height="64"/><rect x="384" y="0" width="64" height="64"/>
    <rect x="64" y="64" width="64" height="64"/><rect x="192" y="64" width="64" height="64"/>
    <rect x="320" y="64" width="64" height="64"/><rect x="448" y="64" width="64" height="64"/>
    <rect x="0" y="384" width="64" height="64"/><rect x="128" y="384" width="64" height="64"/>
    <rect x="256" y="384" width="64" height="64"/><rect x="384" y="384" width="64" height="64"/>
    <rect x="64" y="448" width="64" height="64"/><rect x="192" y="448" width="64" height="64"/>
    <rect x="320" y="448" width="64" height="64"/><rect x="448" y="448" width="64" height="64"/>
  </g>

  <!-- Cavalier -->
  <g filter="url(#soft)">
    <path fill="url(#piece)" d="
      M 168 396
      c -4 -46 14 -74 44 -100
      c 22 -19 34 -34 38 -54
      l -22 12
      c -14 8 -30 4 -36 -10
      c -6 -14 0 -28 12 -36
      l 54 -36
      l -6 -26
      l 26 14
      l 8 -32
      l 22 26
      c 46 12 78 54 82 108
      c 4 54 -8 92 -14 134
      z"/>
    <circle cx="243" cy="196" r="11" fill="#3A3358"/>
    <path d="M 176 404 h 168 c 10 0 16 8 16 18 v 16 h -200 v -16 c 0 -10 6 -18 16 -18 z" fill="url(#piece)"/>
  </g>
</svg>
