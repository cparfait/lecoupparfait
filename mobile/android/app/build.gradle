apply plugin: 'com.android.application'

// La clé de signature : `mobile/signature/keystore.properties`, jamais versionné.
// Sans lui, l'APK de release sort non signé et Android refuse de l'installer.
// La garder précieusement : un APK signé d'une autre clé ne peut pas mettre à
// jour celui qui est déjà installé.
def proprietesSignature = new Properties()
def fichierSignature = rootProject.file('../signature/keystore.properties')
if (fichierSignature.exists()) {
    fichierSignature.withInputStream { proprietesSignature.load(it) }
}

android {
    namespace = "ovh.cparfait.coupparfait"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ovh.cparfait.coupparfait"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // À augmenter à chaque APK publié, en même temps que `APPLI_ANDROID`
        // dans apps/web/src/lib/appliAndroid.ts : c'est cette comparaison qui
        // propose la mise à jour aux appareils déjà équipés.
        versionCode 3
        versionName "1.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }

    /*
     * Deux distributions de la même appli.
     *
     *  - `site` : l'APK servi par la page /appli. Il se met à jour lui-même
     *    (MiseAJourPlugin, permission REQUEST_INSTALL_PACKAGES), faute de
     *    magasin pour le faire. `npm run apk`.
     *  - `play` : l'AAB du Play Store. Google interdit l'auto-mise à jour et la
     *    permission qui va avec : c'est le Play Store qui met l'appli à jour.
     *    `npm run aab`.
     *
     * Même identifiant, même version, même clé : un joueur peut passer de l'une
     * à l'autre sans réinstaller, pourvu que Google signe l'AAB avec cette clé-ci
     * (voir mobile/README.md, « Le Play Store »).
     */
    flavorDimensions = ["distribution"]
    productFlavors {
        site {
            dimension "distribution"
        }
        play {
            dimension "distribution"
        }
    }
    signingConfigs {
        if (fichierSignature.exists()) {
            release {
                storeFile rootProject.file('../signature/' + proprietesSignature['storeFile'])
                storePassword proprietesSignature['storePassword']
                keyAlias proprietesSignature['keyAlias']
                keyPassword proprietesSignature['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (fichierSignature.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
